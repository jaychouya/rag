<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法规检索测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6fa;--card:#fff;--primary:#4f6ef7;--primary-hover:#3b5de7;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--progress-bg:#f0f4ff;--answer-bg:#fff;--error-bg:#fef2f2}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:18px;font-weight:600}
.mode-sel{display:flex;gap:4px;margin-left:auto}
.mode-sel button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:13px;transition:.15s}
.mode-sel button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.mode-sel button:hover:not(.active){background:#f0f4ff}
#chat{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:780px;width:100%;margin:0 auto;border-radius:10px;padding:14px 18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.msg.progress{background:var(--progress-bg);color:var(--muted);font-size:13px;border-left:3px solid var(--primary)}
.msg.answer{background:var(--answer-bg);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg.error{background:var(--error-bg);color:#dc2626;border-left:3px solid #dc2626}
.msg.answer :first-child{margin-top:0}
#input-area{background:var(--card);border-top:1px solid var(--border);padding:14px 24px;flex-shrink:0}
#input-wrap{max-width:780px;margin:0 auto;display:flex;gap:10px}
#query{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:none;height:44px;font-family:inherit;outline:none;transition:.15s}
#query:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
#send{padding:0 22px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
#send:hover{background:var(--primary-hover)}
#send:disabled{opacity:.5;cursor:not-allowed}
.typing{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);animation:blink 1.2s infinite;margin-left:4px}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
<header>
  <h1>法规检索测试</h1>
  <div class="mode-sel">
    <button data-mode="original">原始</button>
    <button data-mode="fast" class="active">极速</button>
    <button data-mode="expert">专家</button>
  </div>
</header>
<div id="chat"></div>
<div id="input-area">
  <div id="input-wrap">
    <textarea id="query" placeholder="描述你的案件或法规问题…" rows="1"></textarea>
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat=document.getElementById('chat'),queryEl=document.getElementById('query'),sendBtn=document.getElementById('send');
let mode='fast',busy=false;

document.querySelectorAll('.mode-sel button').forEach(b=>{
  b.onclick=()=>{
    if(busy)return;
    document.querySelector('.mode-sel .active').classList.remove('active');
    b.classList.add('active');
    mode=b.dataset.mode;
  };
});

queryEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
sendBtn.onclick=doSend;

function addMsg(cls,text){
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.textContent=text||'';
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

async function doSend(){
  const q=queryEl.value.trim();
  if(!q||busy)return;
  busy=true;sendBtn.disabled=true;queryEl.value='';
  addMsg('user',q);
  let progressEl=null,answerEl=null;
  try{
    const base=location.protocol==='file:'?'http://localhost:8000':'';
    const res=await fetch(base+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q,mode})
    });
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const d=JSON.parse(line.slice(6));
        if(d.type==='progress'){
          if(!progressEl)progressEl=addMsg('progress','');
          progressEl.textContent+=(progressEl.textContent?'\n':'')+d.content;
          chat.scrollTop=chat.scrollHeight;
        }else if(d.type==='answer'){
          if(!answerEl)answerEl=addMsg('answer','');
          answerEl.textContent+=d.content;
          chat.scrollTop=chat.scrollHeight;
        }else if(d.type==='error'){
          addMsg('error',d.content);
        }
      }
    }
  }catch(e){addMsg('error','请求失败: '+e.message)}
  busy=false;sendBtn.disabled=false;queryEl.focus();
}
</script>
</body>
</html>
