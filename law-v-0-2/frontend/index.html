<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法规检索测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6fa;--card:#fff;--primary:#4f6ef7;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--progress-bg:#f0f4ff;--answer-bg:#fff;--error-bg:#fef2f2;--debug-bg:#1e1e2e;--debug-fg:#a5f3b4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600}
.mode-sel{display:flex;gap:4px;margin-left:auto}
.mode-sel button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:13px}
.mode-sel button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hdr-right label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
#main{flex:1;display:flex;min-height:0}
#chat-col{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
#debug-panel{width:380px;max-width:42vw;background:var(--debug-bg);color:#e5e7eb;display:flex;flex-direction:column;border-left:1px solid #333}
#debug-panel.hidden{display:none}
#debug-head{padding:10px 14px;border-bottom:1px solid #333;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#debug-log{flex:1;overflow-y:auto;padding:10px 12px;font-family:Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap}
.debug-line{margin-bottom:6px}
.debug-line .ts{color:#94a3b8;margin-right:6px}
.debug-line.progress{color:#93c5fd}
.debug-line.debug{color:var(--debug-fg)}
.debug-line.error{color:#fca5a5}
.debug-line.metrics{color:#fde68a}
.msg{max-width:780px;width:100%;margin:0 auto;border-radius:10px;padding:14px 18px;line-height:1.7;white-space:pre-wrap;font-size:14px}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.msg.progress{background:var(--progress-bg);color:var(--muted);font-size:13px;border-left:3px solid var(--primary)}
.msg.answer{background:var(--answer-bg);border:1px solid var(--border)}
.msg.error{background:var(--error-bg);color:#dc2626}
#input-area{background:var(--card);border-top:1px solid var(--border);padding:14px 24px}
#input-wrap{max-width:780px;margin:0 auto;display:flex;gap:10px}
#query{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;height:44px;font-family:inherit}
#send{padding:0 22px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer}
#send:disabled{opacity:.5}
#llm-config{max-width:780px;margin:10px auto 0;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fafbff}
#llm-config summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.llm-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.llm-grid{display:grid;gap:8px;margin-top:10px}
.llm-grid label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.llm-grid input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.llm-actions{margin-top:8px;display:flex;gap:8px}
.llm-actions button{font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>法规检索测试</h1>
  <div class="mode-sel">
    <button type="button" data-mode="original">原始</button>
    <button type="button" data-mode="fast" class="active">极速</button>
    <button type="button" data-mode="expert">专家</button>
  </div>
  <label class="hdr-right"><input type="checkbox" id="showDebug" checked> 运行过程</label>
</header>
<div id="main">
  <div id="chat-col">
    <div id="chat"></div>
    <div id="input-area">
      <details id="llm-config" open>
        <summary>LLM 配置（必填，用你自己的 Key）</summary>
        <p class="llm-hint">本站不消耗服务端 Token。未填 Key 不会发起对话；检索与总结均走你填写的 API。</p>
        <div class="llm-grid">
          <div><label>llm_api_key</label><input type="password" id="apiKey" autocomplete="off" placeholder="选填"/></div>
          <div><label>llm_base_url</label><input type="text" id="apiBase" placeholder="选填"/></div>
          <div><label>llm_model</label><input type="text" id="apiModel" placeholder="选填"/></div>
        </div>
        <div class="llm-actions">
          <button type="button" id="saveLlm">保存</button>
          <button type="button" id="clearLlm">清除</button>
        </div>
      </details>
      <div id="input-wrap" style="margin-top:10px">
        <textarea id="query" placeholder="输入问题…" rows="1"></textarea>
        <button type="button" id="send">发送</button>
      </div>
    </div>
  </div>
  <aside id="debug-panel">
    <div id="debug-head"><span>运行过程</span><button type="button" id="clearDebug">清空</button></div>
    <div id="debug-log"></div>
  </aside>
</div>
<script>
const API_CHAT='/api/chat';
const LS={key:'law_llm_key',base:'law_llm_base',model:'law_llm_model'};
const chat=document.getElementById('chat');
const queryEl=document.getElementById('query');
const sendBtn=document.getElementById('send');
const debugLog=document.getElementById('debug-log');
const debugPanel=document.getElementById('debug-panel');
let mode='fast',busy=false;

const apiKey=document.getElementById('apiKey');
const apiBase=document.getElementById('apiBase');
const apiModel=document.getElementById('apiModel');
function loadLlm(){
  apiKey.value=localStorage.getItem(LS.key)||'';
  apiBase.value=localStorage.getItem(LS.base)||'';
  apiModel.value=localStorage.getItem(LS.model)||'';
}
loadLlm();
document.getElementById('saveLlm').onclick=function(){
  localStorage.setItem(LS.key,apiKey.value.trim());
  localStorage.setItem(LS.base,apiBase.value.trim());
  localStorage.setItem(LS.model,apiModel.value.trim());
};
document.getElementById('clearLlm').onclick=function(){
  [LS.key,LS.base,LS.model].forEach(function(k){localStorage.removeItem(k);});
  apiKey.value=apiBase.value=apiModel.value='';
};
document.getElementById('showDebug').onchange=function(e){debugPanel.classList.toggle('hidden',!e.target.checked);};
document.getElementById('clearDebug').onclick=function(){debugLog.innerHTML='';};

document.querySelectorAll('.mode-sel button').forEach(function(b){
  b.onclick=function(){
    if(busy)return;
    document.querySelector('.mode-sel .active').classList.remove('active');
    b.classList.add('active');
    mode=b.dataset.mode;
  };
});

function appendDebug(kind,text){
  var d=document.createElement('div');
  d.className='debug-line '+kind;
  d.innerHTML='<span class="ts">'+new Date().toLocaleTimeString('zh-CN',{hour12:false})+'</span>'+String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  debugLog.appendChild(d);
  debugLog.scrollTop=debugLog.scrollHeight;
}
function addMsg(cls,text){
  var d=document.createElement('div');
  d.className='msg '+cls;
  d.textContent=text||'';
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function buildBody(q){
  var body={query:q,mode:mode,show_debug:true};
  var k=apiKey.value.trim(),b=apiBase.value.trim(),m=apiModel.value.trim();
  if(k)body.llm_api_key=k;
  if(b)body.llm_base_url=b;
  if(m)body.llm_model=m;
  return body;
}
async function doSend(){
  var q=queryEl.value.trim();
  if(!q||busy)return;
  busy=true;sendBtn.disabled=true;queryEl.value='';
  addMsg('user',q);
  var progressEl=null,answerEl=null;
  try{
    var res=await fetch(API_CHAT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildBody(q))});
    if(!res.ok)throw new Error('HTTP '+res.status);
    var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
    while(true){
      var chunk=await reader.read();
      if(chunk.done)break;
      buf+=dec.decode(chunk.value,{stream:true});
      var lines=buf.split('\n');
      buf=lines.pop();
      for(var i=0;i<lines.length;i++){
        var line=lines[i];
        if(line.indexOf('data: ')!==0)continue;
        var d;try{d=JSON.parse(line.slice(6));}catch(e){continue;}
        var t=d.type,c=d.content||'';
        if(t==='progress'){
          if(!progressEl)progressEl=addMsg('progress','');
          progressEl.textContent+=(progressEl.textContent?'\n':'')+c;
          appendDebug('progress',c);
        }else if(t==='debug'){appendDebug('debug',c);}
        else if(t==='metrics'){appendDebug('metrics',typeof c==='string'?c:JSON.stringify(c,null,2));}
        else if(t==='answer'){if(!answerEl)answerEl=addMsg('answer','');answerEl.textContent+=c;}
        else if(t==='error'){addMsg('error',c);appendDebug('error',c);}
      }
    }
  }catch(e){addMsg('error','请求失败: '+e.message);}
  busy=false;sendBtn.disabled=false;queryEl.focus();
}
queryEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
sendBtn.onclick=doSend;
</script>
</body>
</html>
